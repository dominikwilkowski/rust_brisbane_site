name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4

      - name: Install mdBook
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # pin@v2.81.10
        with:
          tool: mdbook@0.5

      - name: Generate pages
        run: mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "book/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
